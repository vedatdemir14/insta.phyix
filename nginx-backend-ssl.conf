# Nginx configuration for HTTPS backend
# Bu dosyayı VPS'te /etc/nginx/sites-available/instagram-backend olarak kaydedin

server {
    listen 443 ssl http2;
    server_name 37.140.242.29;

    # SSL sertifikaları (Let's Encrypt kullanıyorsanız)
    # ssl_certificate /etc/letsencrypt/live/37.140.242.29/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/37.140.242.29/privkey.pem;
    
    # Self-signed sertifika (test için)
    # ssl_certificate /etc/nginx/ssl/backend.crt;
    # ssl_certificate_key /etc/nginx/ssl/backend.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Backend'e proxy
    location / {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
        
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
}

# HTTP'den HTTPS'e yönlendirme
server {
    listen 80;
    server_name 37.140.242.29;
    return 301 https://$server_name$request_uri;
}






